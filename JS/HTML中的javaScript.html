charset="" 
crossorigin="跨资源共享设置"

integrity=""

type="text/javascript"></script> -->
<!--  动态加载脚本-->
<script>
    // 创建一个script元素并添加到dom
    let script = document.createElement('script');   
    script.src='111.js';
    // 默认以异步的方式加载  由于不是所有浏览器都支持async属性 所以要统一设置为同步的
    script.async=false;
    document.head.appendChild(script)

    //这种获取加载资源的方式对与加载器不可见，会影响加载队列的优先级，需要在头部告知预加载器知道文件的存在


</script>

</html>
