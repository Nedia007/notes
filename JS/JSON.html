<script>
    // JSON语法
    // 支持3种类型
    // 简单值 ：数字，布尔值和null  ；undefined你不可以
    // 对象：有序键值对里面可以包含简单之也可以是对象和数组
    // 数组：数组里面可以包含简单值 对象和其他数组


    // 简单值
    // 5
    // "Hello World!" //JSON字符串必须使用双引号
    // 对象
    // 与js对象字面量不同
    // JSON的对象必须使用双引号把属性名包起来【js对象可以不用】
    // JSON里面不用声明变量【js对象需要声明变量】
    // {
    //     "name":"nike",
    //     "age":29,
    // }

    // 数组
    [
        {
            "title":"nick",
            "authors":[
                "NIcx",
                "aaa"
            ]
        }
        ,
        {
            "title":"nick",
            "authors":[
                "NIcx",
                "aaa"
            ]
        }
    ]


    // stringify()序列化成JSON字符串
    // parse() 将JSON解析成js值
// stringify()的另外两个参数  
// 如果第二个参数是一个数组，返回的结果只会包含改数组中列出的对象属性
let book ={
    title:"Professional JS",
    authors:[
        "Nick",
        "Matt"
    ],
    edition:4,
    year:2017
};
let jsonText =JSON.stringify(book,["title","edition"]);
// 得到的jsonText  {"title":"Professional JS","edition":4}

// 如果第二个参数是一个函数，函数会接收两个参数 属性名(key)和值(value)
let jsonText1 =JSON.stringify(book,(key,value)=>{
    switch(key){
        case "authors":
            return value.join(",")
        case "year":
            return 5000
        case "edition":
            return undefined;
        default:
            return value;    
    }
})
// 如果数据返回的是undefined 就会跳过该属性

// 第三个参数是字符串缩进和空格 ，这个参数是数值时，表示每一级缩进的空格数
</script>
