        function getgroupedRegions(data,key){
        // 创建一个对象来存储分组后的数据
            const groupedRegions = {};
            // 遍历数据数组
            data.forEach(item => {
                // 提取 "region" 字段的值
                const region = item[key];
                
                // 检查 "region" 是否以数字结尾
                const match = region.match(/(.*)(\d+)$/);
                if (match) {
                    // 提取公共的前缀和数字
                    var prefix = match[1];
                    const number = parseInt(match[2], 10);
                    // console.info(match)
                    // 如果这个前缀还没有在分组对象中，就添加它
                    if (!groupedRegions[prefix]) {
                        groupedRegions[prefix] = [];
                    }
                    
                    // 将当前项添加到对应的分组中
                    groupedRegions[prefix].push({
                        ...item,
                        // 可以在这里添加其他你需要的属性或逻辑
                    });
                    if(!countrys.includes(prefix)){
                        countrys.push(match[1])
                    }
                }else{
                    if(!countrys.includes(item.region)){
                        countrys.push(item.region)
                    }
                }
            });
            return groupedRegions;
        }
        function getRegionOption(data,key,keyItem){

            return regions;
        }
        function getOCTSameVal(arr, str) {

				arr = arr.sort(function(a, b) {

					return s < t ? -1 : 1;
				});

				for (var i in arr) {
