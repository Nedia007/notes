<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
    
    // exec()
    let text="mom and dad and baby";
    let pattern = /mom( and dad( and baby)?)?/gi;
    let matches=pattern.exec(text)
    // index属性 字符串匹配模式的起始位置
    console.log(matches.index);//0
    // input属性 要查找的字符串
    console.log(matches.input);//mom and dad and baby
    // 数组的得一个元素是匹配整个模式的字符串
    console.log(matches[0]);//mom and dad and baby
    // 第二个元素是匹配第一个捕获组的字符串
    console.log(matches[1]);
    console.log(matches[2]);

    // 如果标记了全局标记，每次调用exec方法会返回一个匹配的信息
    // 没有标记全局 则同一个字符串无论调用多少次exec()也只会返回第一个匹配的信息
    // lastIndex在费全局模式下始终不变
    let text1="cat, bat, sat ,fat ";
    let pattern1=/.at/;
    let matches1=pattern.exec(text);
    console.log(matches.index);//0
    console.log(matches[0]);//cat
    console.log(pattern.lastIndex);//0

    // 如果加了g标记 每次调用exec都会在字符串中向前搜索下一个匹配项
    let pattern2=/.at/g;
    var matches2=pattern2.exec(text1);
    console.log(matches2.index);//0
    console.log(matches2[0]);//cat
    console.log(pattern2.lastIndex)//3
    matches2=pattern2.exec(text1);
    console.log(matches2.index);//0
    console.log(matches2[0]);//cat
    console.log(pattern2.lastIndex)//3
    matches2=pattern2.exec(text1);
    console.log(matches2.index);//0
    console.log(matches2[0]);//cat
    console.log(pattern2.lastIndex)//3

    let pattern3=new RegExp("\\[bc\\]at","gi");
    // 以下两个方法都返回正则表达式的字面量表示
    console.log(pattern.toString());
    console.log(pattern.toLocaleString());
    // RegExp构造函数的属性

    let text2="this has been a short summer";
    let pattern4 =/(.)hort/g;

    if(pattern4.test(text2)){
        // 最后搜索的字符串
        console.log(RegExp.input);
        // input中出现在lastMatch前面的文本
        console.log(RegExp.leftContext);
        // input中出现在lastMatch后面的文本
        console.log(RegExp.rightContext);
        // 最后匹配的文本
        console.log(RegExp.lastMatch);//short
        // 最后匹配的捕获组
        console.log(RegExp.lastParen)//s
    }

</script>
</html>
