// Symbol.iterator有这个值就可以被for of 迭代，没有这个值就不能被迭代

// 可以使用for of 遍历 是由于具备iterator属性 
// Array Arguments Set Map String TypedArray NodeList 都可以使用for of
// 对象不能用for of 我们总计加上这个属性就可以用了

let aaobj ={

};

}
// 这里有个缺陷： 因为我们使用的是数组原型上的Symbol.iterator，所以对象必须是个伪数组才能遍历，自定义一个对象上的Symbol.iterator属性，使其更加通用

let bbobj ={
    0: 'zhangsan',
    1: 21,
    length: 2,
    [Symbol.iterator](){
        console.log(this)
        let index  = 0
        let Keyarr = Object.keys(this)
        let len = Keyarr.length
        return{
            next: ()=>{
                if(index >= len) return {
                    value:undefined,
                    done:true
                }
                let result ={
                    value:this[Keyarr[index]],
                    done:false
                }
                index++
                return result
            }
        }
    }
};
for (let item of bbobj){
    console.log(item)
}
