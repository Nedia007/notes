// readyState属性可以表示当前的请求和响应处在哪个阶段
// redState变化时，会触发readystatechange事件，可以用来检查readyState的值
xhr.onreadystatechange = function(){//要在open之前赋值
    if(xhr.readyState == 4){//已完成
        if((xhr.status>=200 && xhr.status <300)|| xhr.status == 304){
            alert(xhr.responseText)//返回响应体的文本
        }else{
            alert("Request was unsuccessful:"+ xhr.status);
        }

    }
}

// Request对象
// 1.创建Request对象
// new Request('url','init对象')
// 没有init对象使用默认值

// 2.克隆Request对象
// 一：将实例作为input参数传给Request构造函数，会得到他的副本
let r1=new Request('https://foo.com');
let r2= new Request(r1,{method:'POST'})

console.log(r1.method)
console.log(r2.method)
// 构造函数克隆不能得到一模一样的
// 第一个请求的请求体会被标记为“已使用”
// 对象的源不同，referreer属性会被清除

// 二：使用clone()方法
// 会创建一模一样的副本，任何值都不会被覆盖

r1 = new Request('https://foo.com',{method:'POST',body:'foobar'});
r2 = r1.clone();
console.log(r1.bodyUsed);//false
console.log(r2.bodyUsed) ;//false
// 如果被的复制的请求对象的请求体已经被读取，那么就不能用clone来创建对象的副本
// 会抛出异常

// 三：在fetch中使用Request对象
// 会像构造函数一样init对象会被覆盖传入请求对象的值
// 向foo.com发送GET请求

// 向foo.com 发送POST请求
